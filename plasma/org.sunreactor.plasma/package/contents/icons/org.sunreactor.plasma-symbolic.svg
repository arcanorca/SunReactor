<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <title>SunReactor</title>
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #232629; }
    </style>
    <clipPath id="symL"><polygon points="0,0 12.6,0 9.4,22 0,22"/></clipPath>
    <clipPath id="symR"><polygon points="12.6,0 22,0 22,22 9.4,22"/></clipPath>
    <mask id="symMask">
      <rect width="22" height="22" fill="#ffffff"/>
      <!-- Shades & smile cut cleanly on the sunlit half -->
      <path d="M4.6 8.2H11.5V9.8H10.2V11.8H6V9.8H4.6Z" fill="#000000" clip-path="url(#symL)"/>
      <path d="M8.3 14.3Q11 15.9 13.7 14.3" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round" clip-path="url(#symL)"/>
    </mask>
    <g id="symGear" transform="rotate(8.28 11 11)">
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(22.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(67.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(112.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(157.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(202.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(247.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(292.5 11 11)"/>
      <rect x="9.7" y="1.8" width="2.6" height="3.4" rx="0.8" transform="rotate(337.5 11 11)"/>
      <circle cx="11" cy="11" r="6.7"/>
    </g>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor">
    <!-- Left angled half: solid sunlit gear with shades & smile -->
    <use href="#symGear" clip-path="url(#symL)" mask="url(#symMask)"/>
    <!-- Right angled half: clean outlined crescent-rim night half + star -->
    <g clip-path="url(#symR)">
      <use href="#symGear" fill="none" stroke="currentColor" stroke-width="1.35"/>
      <path d="M12.6 10.6Q14.1 11.8 15.6 10.6" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
      <path d="M11 15.1Q12.6 15.1 13.7 14.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <path d="M18.6 2.2L19.1 3.4L20.3 3.9L19.1 4.4L18.6 5.6L18.1 4.4L16.9 3.9L18.1 3.4Z"/>
  </g>
</svg>
