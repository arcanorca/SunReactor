<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>SunReactor</title>
  <!--
    KDE gear as the sun, diagonally half in night shade: the sunlit side wears
    cool pixel shades, the night side rests peacefully beneath the stars.
    Uses explicit SVG Tiny 1.2 split paths (no clipPath/mask/use) so QtSvg
    (KDE Plasma KIconLoader / Kirigami.Icon) renders both halves identically.
  -->
  <defs>
    <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0" stop-color="#323842"/>
      <stop offset="1" stop-color="#22272f"/>
    </linearGradient>
    <linearGradient id="sunGrad" gradientUnits="userSpaceOnUse" x1="3.8" y1="3.8" x2="20" y2="44.2">
      <stop offset="0" stop-color="#ffd842"/>
      <stop offset="0.55" stop-color="#ffbf1a"/>
      <stop offset="1" stop-color="#ff990a"/>
    </linearGradient>
    <linearGradient id="nightGrad" gradientUnits="userSpaceOnUse" x1="15.9" y1="3.8" x2="44.2" y2="44.2">
      <stop offset="0" stop-color="#6b7cf2"/>
      <stop offset="0.55" stop-color="#5564d8"/>
      <stop offset="1" stop-color="#3e49ad"/>
    </linearGradient>
  </defs>

  <!-- Dark Breeze-slate rounded badge with subtle top-edge inset bevel -->
  <rect width="48" height="48" rx="10" fill="url(#bgGrad)"/>
  <rect x="0.6" y="0.6" width="46.8" height="46.8" rx="9.4" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.9"/>

  <!-- Left angled half: Sun / Day -->
  <path d="M22.05 38.67L21.80 38.64A14.80 14.80 0 0 1 20.01 38.25L18.20 41.89A1.60 1.60 0 0 1 16.05 42.61L13.90 41.54A1.60 1.60 0 0 1 13.19 39.39L15.00 35.75A14.80 14.80 0 0 1 12.40 33.19L8.79 35.06A1.60 1.60 0 0 1 6.63 34.38L5.52 32.25A1.60 1.60 0 0 1 6.21 30.10L9.81 28.22A14.80 14.80 0 0 1 9.21 24.61L5.19 24.01A1.60 1.60 0 0 1 3.85 22.19L4.20 19.82A1.60 1.60 0 0 1 6.02 18.47L10.04 19.08A14.80 14.80 0 0 1 11.68 15.80L8.78 12.95A1.60 1.60 0 0 1 8.76 10.69L10.44 8.98A1.60 1.60 0 0 1 12.70 8.96L15.60 11.81A14.80 14.80 0 0 1 18.85 10.13L18.18 6.11A1.60 1.60 0 0 1 19.49 4.27L21.86 3.88A1.60 1.60 0 0 1 23.70 5.19L24.37 9.20A14.80 14.80 0 0 1 26.20 9.36L26.44 9.40Z" fill="url(#sunGrad)"/>

  <!-- Right angled half: Night / Twilight -->
  <path d="M26.20 9.36A14.80 14.80 0 0 1 27.99 9.75L29.80 6.11A1.60 1.60 0 0 1 31.95 5.39L34.10 6.46A1.60 1.60 0 0 1 34.81 8.61L33.00 12.25A14.80 14.80 0 0 1 35.60 14.81L39.21 12.94A1.60 1.60 0 0 1 41.37 13.62L42.48 15.75A1.60 1.60 0 0 1 41.79 17.90L38.19 19.78A14.80 14.80 0 0 1 38.79 23.39L42.81 23.99A1.60 1.60 0 0 1 44.15 25.81L43.80 28.18A1.60 1.60 0 0 1 41.98 29.53L37.96 28.92A14.80 14.80 0 0 1 36.32 32.20L39.22 35.05A1.60 1.60 0 0 1 39.24 37.31L37.56 39.02A1.60 1.60 0 0 1 35.30 39.04L32.40 36.19A14.80 14.80 0 0 1 29.15 37.87L29.82 41.89A1.60 1.60 0 0 1 28.51 43.73L26.14 44.12A1.60 1.60 0 0 1 24.30 42.81L23.63 38.80A14.80 14.80 0 0 1 21.80 38.64Z" fill="url(#nightGrad)"/>

  <!-- Pixel sunglasses + diagonal specular glint (pre-clipped cleanly along diagonal seam) -->
  <path d="M10 18H24.9L24.45 21H22.2V26H20V28H14V26H12V21H10Z" fill="#14161e"/>
  <path d="M14 21H16V23H14ZM16 23H18V25H16Z" fill="#ffffff"/>

  <!-- Calm closed eye on Night side -->
  <path d="M27.6 23Q30.8 25.8 34 23" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Continuous smile split cleanly along the diagonal -->
  <path d="M18.83 30.18A1.20 1.20 0 0 0 17.57 32.22L17.87 32.40L18.17 32.58L18.47 32.74L18.78 32.90L19.08 33.05L19.39 33.19L19.70 33.32L20.00 33.44L20.31 33.55L20.62 33.66L20.93 33.75L21.24 33.84L21.56 33.92L21.87 33.98L22.18 34.04L22.49 34.09L22.84 31.72L22.59 31.68L22.34 31.63L22.10 31.58L21.85 31.52L21.61 31.45L21.36 31.37L21.11 31.29L20.86 31.20L20.61 31.10L20.36 30.99L20.11 30.88L19.85 30.75L19.60 30.62L19.35 30.48L19.09 30.34Z" fill="#14161e"/>
  <path d="M22.84 31.72L22.49 34.09L23.00 34.15L23.50 34.19L24.00 34.20L24.51 34.19L25.01 34.15L25.51 34.09L26.01 34.01L26.51 33.90L27.01 33.77L27.50 33.62L28.00 33.44L28.49 33.24L28.98 33.02L29.47 32.77L29.95 32.51L30.43 32.22A1.20 1.20 0 0 0 29.17 30.18L28.76 30.42L28.35 30.65L27.94 30.85L27.54 31.03L27.14 31.20L26.74 31.34L26.35 31.46L25.95 31.57L25.56 31.65L25.17 31.72L24.78 31.76L24.39 31.79L24.00 31.80L23.61 31.79L23.22 31.76Z" fill="#ffffff"/>

  <!-- Starlight night accents -->
  <path d="M39.8 5.0Q39.8 8.4 43.2 8.4Q39.8 8.4 39.8 11.8Q39.8 8.4 36.4 8.4Q39.8 8.4 39.8 5.0Z" fill="#fff4b8"/>
  <path d="M42.2 32.4Q42.2 34.4 44.2 34.4Q42.2 34.4 42.2 36.4Q42.2 34.4 40.2 34.4Q42.2 34.4 42.2 32.4Z" fill="#b9ccff" opacity="0.9"/>
</svg>
