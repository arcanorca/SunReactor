[package]
name = "sunreactor"
version = "0.12.0"
edition = "2021"
description = "sunreactor daemon and CLI for adaptive brightness control"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4"
crossterm = { version = "0.27", optional = true }
deunicode = "1.6.2"
ratatui = { version = "0.26", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4.4"
thiserror = "2.0.18"
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-input = { version = "0.15.0", optional = true }
ureq = "2.10"
tz-rs = "0.6.14"
tzdb = "0.7"
tempfile = "3.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "0.38", features = ["fs", "net", "process"] }
async-io = "2.6"
futures-lite = "2.6"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["tui", "wayland"]
tui = ["ratatui", "crossterm", "tui-input"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-plasma"]

[lib]
name = "sunreactor"
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
